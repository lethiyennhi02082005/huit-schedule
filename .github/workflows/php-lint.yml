name: PHP Syntax Check (CI)

on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:
    branches:
      - main
      - master

jobs:
  php-lint:
    name: PHP Syntax Lint (php -l)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql

      - name: Check PHP syntax errors (php -l)
        run: |
          echo "Scanning all PHP files in app, config, database, and routes..."
          find app config database routes -type f -name "*.php" -exec php -l {} \;
